services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres-container
    environment:
      POSTGRES_PASSWORD: postgres
      # POSTGRES_USER: postgres (optional, defaults to postgres)
      # POSTGRES_DB: my_db      (optional, defaults to user name)
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  blog-app:
    build:
      context: ./blog-app
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      JWT_SECRET: ${JWT_SECRET:-signature}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  blog-client:
    build:
      context: ./blog-client
      dockerfile: Dockerfile
    depends_on:
      blog-app:
        condition: service_healthy
    environment:
      VITE_BACKEND_URL: http://localhost:4000
    volumes:
      - ./blog-client:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  pg_data:

